name: Renovate

on:
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Renovate
        env:
          LOG_LEVEL: debug
        run: |
          docker run --rm \
            --env RENOVATE_TOKEN=${{ secrets.RENOVATE_TOKEN }} \
            --env LOG_LEVEL=debug \
            --volume ${{ github.workspace }}:/repo \
            --workdir /repo \
            ghcr.io/renovatebot/renovate:44 \
            --platform github \
            ${{ github.repository }}
